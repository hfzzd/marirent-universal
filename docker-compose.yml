services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: marirent-app
    container_name: marirent-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - marirent-network

  nginx:
    image: nginx:alpine
    container_name: marirent-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx:/etc/nginx/conf.d
    networks:
      - marirent-network

  db:
    image: mysql:8.0
    container_name: marirent-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    ports:
      - "${DB_PORT:-3306}:3306"
    networks:
      - marirent-network

  redis:
    image: redis:alpine
    container_name: marirent-redis
    restart: unless-stopped
    networks:
      - marirent-network

networks:
  marirent-network:
    driver: bridge
